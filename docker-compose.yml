services:
  app:
    build: .
    env_file: config.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

  database:
    image: postgres:18-alpine
    env_file: config.env
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "5432:5432"

volumes:
  pgdata: